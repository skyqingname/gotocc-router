name: GoToCC Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gotocc-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parameters:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.build.outputs.node }}
      runner: ${{ steps.build.outputs.runner }}
      timeout: ${{ steps.build.outputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        name: Read build parameters
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          config = json.loads(Path('gotocc-build.json').read_text())
          print('node=' + config['node_version'])
          print('runner=' + config['ci_runner'])
          print('timeout=' + str(config['ci_timeout_minutes']))
          PY

  build:
    needs: parameters
    runs-on: ${{ needs.parameters.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.parameters.outputs.timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.parameters.outputs.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build frontend and embedded backend
        run: python3 tools/gotocc_build.py --output "$RUNNER_TEMP/sub2api"
      - name: Type-check backend packages and tests
        run: |
          go -C backend vet -tags=unit ./...
          go -C backend vet -tags=integration ./...
